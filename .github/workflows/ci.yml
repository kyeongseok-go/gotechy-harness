# 하네스 v2 CI — 라이브러리 자체의 검사 (lint·타입·테스트). 템플릿 무결성 검사(init.sh)는 2단계에서 templates/로 이관.
name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage
      - name: exec-plan hygiene
        run: |
          for f in docs/exec-plans/active/*.md; do
            [ -e "$f" ] || continue
            grep -q "## Validation" "$f" || { echo "$f 에 Validation 섹션 없음"; exit 1; }
          done

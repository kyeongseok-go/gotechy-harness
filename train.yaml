# gotechy train: 함께 검증한 도구 버전 묶음 (contract.md 10.1절, ADR 0004)
# 버전은 2026-10-14 M0 실험(macOS arm64, 격리 설치)에서 확인한 값이다.
# 2026.11.0(2026-11-05, 업그레이드 루프 U5): 발행 5일 이상 지난 최신 안정판으로 올리고 격리 설치로 확인했다.
# claude 2.1.296은 headless에서 승인된 도구 호출이 두 번 실행될 수 있는 회귀가 있었다(2.1.299에서 고침).
train: 2026.11.0
mise:
  version: 2026.10.8
  sha256:
    macos-arm64: dd77de9a7574e38d8409fb06fa85e1581415896639d075987791d8c4e5a57b73
    macos-x64: a122fd04db5f2da07d24528ed61109bc82142ca44e821d4faafa05650f6ba627
    linux-arm64: 6ee0bd8173f1347514f4974d55fb1fae13aa7f6de0a55338adbefa0667cad7e5
    linux-x64: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
tools:
  mise: { version: 2026.10.8, pin: A, check: mise --version }
  bun: { version: 1.4.4, pin: A, check: bun --version, mise: bun }
  node: { version: 24.22.2, pin: A, check: node --version, mise: node }
  uv: { version: 0.13.6, pin: A, check: uv --version, mise: uv }
  gh: { version: 2.103.3, pin: A, check: gh --version, mise: "aqua:cli/cli" }
  apm: { version: 0.35.0, pin: A, check: apm --version, mise: "github:microsoft/apm" }
  gitleaks: { version: 8.30.1, pin: A, check: gitleaks version, mise: "aqua:gitleaks/gitleaks" }
  claude: { version: 2.1.316, pin: A, check: claude --version, mise: "aqua:anthropics/claude-code" }
  codex: { version: 0.166.0, pin: A, check: codex --version, mise: "aqua:openai/codex" }
  orca: { version: 1.4.209, pin: C, check: orca --version }
# 프로젝트에 까는 팩의 출처(contract.md 10.1절, 10.7절). ref는 이 저장소의 커밋이고, 그 커밋의 skills/가 지금과 같아야 한다
packs:
  source: kyeongseok-go/gotechy-harness
  ref: aa499c8a0eac9e1a635a26e6a69c8d466a9f7bd5
# 전역 설정에 넣는 정책(contract.md 10.1절). 자동 업데이트 끄기(claude의 DISABLE_AUTOUPDATER, codex의
# check_for_update_on_startup)는 넣지 않는다. 오너가 쓰는 claude와 codex가 업데이트를 못 받게 되어서다
# (2026-10-15 오너 결정, T-005). 워커는 어댑터가 따로 끄고 train 버전 그대로 돈다
policy:
  claude:
    env: {}
    deny:
      - "Bash(gotechy decide:*)"
      - "Bash(script:*)"
      - "Bash(expect:*)"
      - "Bash(gotechy serve:*)"
      - "Bash(gotechy keys:*)"
      - "Bash(gotechy loop:*)"
  codex: {}
